version: "3.9"

# ============================================================
# Ziptalk — Stack local de desenvolvimento
#
# Sobe: Evolution API + Postgres (Evolution) + Redis
# ============================================================

services:
  evolution:
    image: atendai/evolution-api:v2.2.0
    container_name: ziptalk_evolution
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_TYPE=http
      - SERVER_PORT=8080
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:evolution@evolution-postgres:5432/evolution
      - DATABASE_CONNECTION_CLIENT_NAME=evolution
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/0
      - CACHE_REDIS_PREFIX_KEY=evolution
      - CACHE_LOCAL_ENABLED=false
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-change-me-to-a-secure-key}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - WEBHOOK_GLOBAL_ENABLED=false
      - WEBSOCKET_ENABLED=true
      - LOG_LEVEL=ERROR,WARN,INFO
      - LOG_COLOR=true
      - DEL_INSTANCE=false
      - LANGUAGE=pt-BR
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      - evolution-postgres
      - redis
    networks:
      - ziptalk

  evolution-postgres:
    image: postgres:16-alpine
    container_name: ziptalk_evolution_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=evolution
      - POSTGRES_DB=evolution
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data
    networks:
      - ziptalk

  redis:
    image: redis:7-alpine
    container_name: ziptalk_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ziptalk

volumes:
  evolution_instances:
  evolution_postgres_data:
  redis_data:

networks:
  ziptalk:
    driver: bridge
