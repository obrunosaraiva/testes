name: quiz-pompower CI

on:
  push:
    branches:
      - "claude/setup-quiz-pompower-**"
      - "quiz-pompower-**"
    paths:
      - "quiz-pompower/**"
      - ".github/workflows/quiz-pompower-ci.yml"
  pull_request:
    paths:
      - "quiz-pompower/**"
      - ".github/workflows/quiz-pompower-ci.yml"

defaults:
  run:
    working-directory: quiz-pompower

jobs:
  verify:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: quiz-pompower/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build (production)
        env:
          # Build não chama Supabase; valores fake só pra satisfazer o
          # "Missing env vars" check de algum import.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
        run: npm run build
