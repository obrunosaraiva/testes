<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>PRD Generator</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <div class="brand">
        <span class="logo">⌁</span>
        <div class="brand-text">
          <strong>PRD Generator</strong>
          <small>Ideia → PRD → Claude Code</small>
        </div>
      </div>
      <div class="header-actions">
        <button id="history-btn" class="icon-btn with-badge" title="Histórico" aria-label="Histórico">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 8v4l3 2"/></svg>
          <span id="history-badge" class="badge hidden" aria-hidden="true"></span>
        </button>
        <button id="settings-btn" class="icon-btn" title="Opções" aria-label="Opções">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </div>
    </header>

    <div id="progress" class="progress">
      <div id="progress-bar" class="progress-bar"></div>
      <span id="progress-label" class="progress-label"></span>
    </div>

    <main id="chat" class="chat" aria-live="polite"></main>

    <footer class="composer">
      <textarea
        id="input"
        class="input"
        rows="3"
        placeholder="Descreva sua ideia em uma frase..."
        aria-label="Sua resposta"
      ></textarea>
      <div class="composer-actions">
        <button id="reset-btn" class="btn-ghost" title="Reiniciar entrevista">Reiniciar</button>
        <button id="send-btn" class="btn-primary">Enviar ⏎</button>
      </div>
    </footer>

    <!-- Painel de histórico -->
    <aside id="history-panel" class="panel hidden" aria-hidden="true">
      <div class="panel-header">
        <strong>Histórico</strong>
        <button id="history-close" class="icon-btn" aria-label="Fechar">✕</button>
      </div>
      <div id="history-list" class="history-list"></div>
      <div class="panel-footer">
        <button id="history-clear" class="btn-ghost">Limpar tudo</button>
      </div>
    </aside>

    <script type="module" src="popup.js"></script>
  </body>
</html>
