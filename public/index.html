<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kanban Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="12" height="12" rx="3" fill="#0D9488"/>
          <rect x="16" width="12" height="8" rx="3" fill="#14B8A6"/>
          <rect x="16" y="10" width="12" height="4" rx="2" fill="#0D9488" opacity="0.4"/>
          <rect y="16" width="12" height="12" rx="3" fill="#14B8A6" opacity="0.6"/>
          <rect x="16" y="16" width="12" height="12" rx="3" fill="#0D9488" opacity="0.8"/>
        </svg>
        <span>Kanban <strong>Pro</strong></span>
      </div>
      <div class="header-right">
        <div class="view-toggle" role="group" aria-label="View toggle">
          <button class="view-btn active" id="btn-view-board" aria-pressed="true">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="18" rx="1"/><rect x="14" y="3" width="7" height="10" rx="1"/><rect x="14" y="17" width="7" height="4" rx="1"/>
            </svg>
            Board
          </button>
          <button class="view-btn" id="btn-view-gantt" aria-pressed="false">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
              <rect x="5" y="4" width="6" height="4" rx="1" fill="currentColor" stroke="none"/>
              <rect x="13" y="10" width="7" height="4" rx="1" fill="currentColor" stroke="none"/>
              <rect x="7" y="16" width="9" height="4" rx="1" fill="currentColor" stroke="none"/>
            </svg>
            Gantt
          </button>
        </div>
        <button class="btn-add-task" id="btn-open-modal" aria-label="Add new task">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          New Task
        </button>
      </div>
    </div>
  </header>

  <!-- Board View -->
  <main class="board-container" id="view-board">
    <div class="board" id="board"></div>
  </main>

  <!-- Gantt View -->
  <main class="gantt-container" id="view-gantt" style="display:none">
    <div class="gantt-wrap" id="gantt-wrap"></div>
  </main>

  <!-- Task Modal -->
  <div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">New Task</h2>
        <button class="modal-close" id="modal-close" aria-label="Close modal">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <form id="task-form">
        <input type="hidden" id="task-id" />
        <div class="form-group">
          <label for="task-title">Title <span class="required">*</span></label>
          <input type="text" id="task-title" placeholder="What needs to be done?" autocomplete="off" required />
        </div>
        <div class="form-group">
          <label for="task-description">Description</label>
          <textarea id="task-description" placeholder="Add more details..." rows="3"></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="task-priority">Priority</label>
            <select id="task-priority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>
          <div class="form-group">
            <label for="task-column">Column</label>
            <select id="task-column">
              <option value="todo">To Do</option>
              <option value="inprogress">In Progress</option>
              <option value="review">Review</option>
              <option value="done">Done</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="task-start">Start Date</label>
            <input type="date" id="task-start" />
          </div>
          <div class="form-group">
            <label for="task-due">Due Date</label>
            <input type="date" id="task-due" />
          </div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn-cancel" id="btn-cancel">Cancel</button>
          <button type="submit" class="btn-submit" id="btn-submit">Create Task</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Delete Confirm -->
  <div class="modal-overlay" id="delete-overlay" role="dialog" aria-modal="true">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h2>Delete Task</h2>
        <button class="modal-close" id="delete-close" aria-label="Close">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <p class="delete-msg">Are you sure you want to delete this task? This action cannot be undone.</p>
      <div class="form-actions">
        <button type="button" class="btn-cancel" id="delete-cancel">Cancel</button>
        <button type="button" class="btn-delete" id="delete-confirm">Delete</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
